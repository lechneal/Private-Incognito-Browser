apply plugin: 'com.android.application'

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.lechneralexander.privatebrowser"
        minSdkVersion 14
        targetSdkVersion 33
        versionCode 64
        versionName "2.9.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles 'proguard-project.txt'
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-project.txt'
        }
    }

    lintOptions {
        abortOnError true
    }
    packagingOptions {
        resources {
            excludes += ['.readme']
        }
    }

    namespace 'com.lechneralexander.privatebrowser'
}


dependencies {
    // support libraries
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'com.google.android.material:material:1.9.0'

    // review
    implementation 'com.google.android.play:review:2.0.1'

    // event bus
    implementation 'com.squareup:otto:1.3.8'

    // dependency injection
    implementation 'com.google.dagger:dagger-android:2.35.1'
    implementation 'com.google.dagger:dagger-android-support:2.30.1'
    // if you use the support libraries
    annotationProcessor 'com.google.dagger:dagger-android-processor:2.47'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.30.1'
    compileOnly 'javax.annotation:jsr250-api:1.0'

    // view binding
    annotationProcessor 'com.jakewharton:butterknife:7.0.1'
    implementation 'com.jakewharton:butterknife:7.0.1'

    // permissions
    implementation 'com.anthonycr.grant:permissions:1.1.2'
}